<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="gradFrontend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gradBackend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gradDatabase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#F8FAFC" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Como o Sistema Funciona</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#64748B">Arquitetura em 3 camadas — Neo Kaizen</text>

  <!-- ===== FRONTEND BLOCK ===== -->
  <rect x="80" y="85" width="640" height="100" rx="10" fill="url(#gradFrontend)" filter="url(#shadow)"/>
  <!-- Icon: Monitor -->
  <rect x="110" y="107" width="56" height="42" rx="4" fill="none" stroke="#fff" stroke-width="2.5"/>
  <line x1="110" y1="158" x2="166" y2="158" stroke="#fff" stroke-width="2.5"/>
  <line x1="138" y1="149" x2="138" y2="158" stroke="#fff" stroke-width="2.5"/>
  <line x1="126" y1="166" x2="150" y2="166" stroke="#fff" stroke-width="2"/>
  <!-- Text -->
  <text x="190" y="115" font-size="17" font-weight="700" fill="#FFFFFF">FRONTEND — A Interface</text>
  <text x="190" y="138" font-size="12.5" fill="#E0F2FE">O que o usuário vê e acessa</text>
  <text x="190" y="158" font-size="11.5" fill="#BAE6FD">Formulários, botões, telas de acompanhamento, login</text>

  <!-- Analogy tag frontend -->
  <rect x="590" y="108" width="108" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="644" y="127" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">O "Cardápio"</text>

  <!-- ===== ARROW 1 ===== -->
  <line x1="400" y1="185" x2="400" y2="210" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="394,208 400,220 406,208" fill="#94A3B8"/>
  <text x="420" y="203" font-size="10" fill="#64748B">pedidos vão e voltam</text>

  <!-- ===== BACKEND BLOCK ===== -->
  <rect x="80" y="220" width="640" height="110" rx="10" fill="url(#gradBackend)" filter="url(#shadow)"/>
  <!-- Icon: Gear -->
  <circle cx="138" cy="165" r="22" fill="none" stroke="#fff" stroke-width="2.5" transform="translate(0,100)"/>
  <circle cx="138" cy="165" r="9" fill="none" stroke="#fff" stroke-width="2" transform="translate(0,100)"/>
  <line x1="138" y1="138" x2="138" y2="148" stroke="#fff" stroke-width="2.5" transform="translate(0,100)"/>
  <line x1="138" y1="182" x2="138" y2="192" stroke="#fff" stroke-width="2.5" transform="translate(0,100)"/>
  <line x1="111" y1="165" x2="121" y2="165" stroke="#fff" stroke-width="2.5" transform="translate(0,100)"/>
  <line x1="155" y1="165" x2="165" y2="165" stroke="#fff" stroke-width="2.5" transform="translate(0,100)"/>
  <!-- Text -->
  <text x="190" y="252" font-size="17" font-weight="700" fill="#FFFFFF">BACKEND — O Processamento</text>
  <text x="190" y="275" font-size="12.5" fill="#FFF7ED">A "cozinha" que prepara e valida tudo</text>
  <text x="190" y="295" font-size="11.5" fill="#FED7AA">Autenticação · Regras de negócio · Filas · Priorização · Auditoria</text>
  <text x="190" y="313" font-size="11.5" fill="#FED7AA">Controle de acesso por perfil · Validação de dados · API REST</text>

  <!-- Analogy tag backend -->
  <rect x="590" y="248" width="108" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="644" y="267" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">A "Cozinha"</text>

  <!-- ===== ARROW 2 ===== -->
  <line x1="400" y1="330" x2="400" y2="355" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="394,353 400,365 406,353" fill="#94A3B8"/>
  <text x="420" y="348" font-size="10" fill="#64748B">busca e grava dados</text>

  <!-- ===== DATABASE BLOCK ===== -->
  <rect x="80" y="365" width="640" height="100" rx="10" fill="url(#gradDatabase)" filter="url(#shadow)"/>
  <!-- Icon: Cylinder (database) -->
  <ellipse cx="138" cy="390" rx="22" ry="9" fill="none" stroke="#fff" stroke-width="2"/>
  <line x1="116" y1="390" x2="116" y2="430" stroke="#fff" stroke-width="2"/>
  <line x1="160" y1="390" x2="160" y2="430" stroke="#fff" stroke-width="2"/>
  <ellipse cx="138" cy="430" rx="22" ry="9" fill="none" stroke="#fff" stroke-width="2"/>
  <ellipse cx="138" cy="408" rx="22" ry="7" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- Text -->
  <text x="190" y="397" font-size="17" font-weight="700" fill="#FFFFFF">BANCO DE DADOS — O Armazenamento</text>
  <text x="190" y="420" font-size="12.5" fill="#F0FDF4">O "estoque" seguro com todas as informações</text>
  <text x="190" y="440" font-size="11.5" fill="#BBF7D0">Usuários · Solicitações · Protocolos · Anexos · Histórico de ações</text>

  <!-- Analogy tag database -->
  <rect x="590" y="388" width="108" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="644" y="407" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">O "Estoque"</text>

  <!-- ===== FOOTER — DIFERENCIAIS ===== -->
  <rect x="30" y="480" width="740" height="30" rx="6" fill="#E2E8F0"/>
  <text x="400" y="500" text-anchor="middle" font-size="10.5" fill="#475569">
    Segurança: senhas criptografadas · Confiabilidade: rastreabilidade total · Organização: módulos independentes · Docker para atualizações fáceis
  </text>
</svg>